name: render-demo

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: fruitcusp/house-data
          token: ${{ secrets.DATA_TOKEN }}
          path: .vault

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run
        run: bash .vault/brain/pipelines/video-render.sh

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: out/demo.mp4
          retention-days: 7
